name: "Build isideload"

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
            artifact_name: "minimal"
            asset_name: "minimal-linux-amd64"
          - platform: "ubuntu-22.04-arm"
            artifact_name: "minimal"
            asset_name: "minimal-linux-arm64"
          - platform: "windows-latest"
            artifact_name: "minimal.exe"
            asset_name: "minimal-windows.exe"
          - platform: "macos-latest"
            artifact_name: "minimal"
            asset_name: "minimal-macos"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Build
        run: cargo build -p minimal

      - name: Rename binary for release
        shell: bash
        run: mv target/debug/${{ matrix.artifact_name }} target/debug/${{ matrix.asset_name }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: target/debug/${{ matrix.asset_name }}

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Get commit message for title
        id: commit_info
        run: echo "title=$(git log -1 --pretty=format:%s)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.run_id }}
          name: ${{ steps.commit_info.outputs.title }}
          files: release-artifacts/*
